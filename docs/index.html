<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7b7c9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="G検定 単語">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>G検定 527語 学習カード</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <div class="top-fox" aria-hidden="true">🦊</div>
      <h1>G検定 学習カード</h1>
      <div class="subtitle">Excelの用語集から作成・端末内で進捗を保存</div>
      <div class="stats">
        <div class="stat"><strong id="total-count">0</strong><span>全用語</span></div>
        <div class="stat"><strong id="known-count">0</strong><span>覚えた</span></div>
        <div class="stat"><strong id="review-count">0</strong><span>復習</span></div>
      </div>
      <div class="bar"><div id="bar-fill"></div></div>
    </header>

    <section class="controls" aria-label="絞り込み">
      <select id="category"><option value="">すべてのカテゴリ</option></select>
      <input id="search" type="search" placeholder="用語や説明を検索">
    </section>
    <div class="filter-info"><span id="result-count"></span><span id="position"></span></div>

    <article id="card" class="card">
      <div id="content">
        <span id="card-category" class="category"></span>
        <h2 id="term"></h2>
        <div id="mnemonic" class="mnemonic"></div>
        <div id="reveal" class="tap" role="button" tabindex="0">タップして説明を見る</div>
        <div id="answer" hidden>
          <div class="answer-block"><h3>一言説明</h3><p id="summary"></p></div>
          <div class="answer-block"><h3>試験での見られ方</h3><p id="exam"></p></div>
          <div class="answer-block"><h3>似ている語との違い</h3><p id="difference"></p></div>
          <div class="answer-block"><h3>自分の言葉メモ</h3><textarea id="memo" placeholder="自分なりの説明を書くと記憶に残りやすくなります"></textarea></div>
        </div>
      </div>
      <div id="empty" hidden>該当する用語がありません。検索条件を変えてください。</div>
    </article>

    <div class="actions">
      <button id="review-button" class="review">あとで復習</button>
      <button id="known-button" class="known">覚えた</button>
      <button id="random-button" class="secondary">ランダム</button>
      <button id="next-button" class="secondary">次のカード</button>
      <button id="review-only" class="secondary wide">復習だけ表示</button>
    </div>
    <footer>進捗とメモは、この端末のブラウザー内に保存されます。</footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
